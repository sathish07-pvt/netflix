<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netflix — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Cinematic Background -->
  <div class="bg-wrap">
    <div class="bg-slide active" style="background-image:url('https://images.unsplash.com/photo-1717326086495-fced92fb7121?auto=format&fit=crop&w=2400&q=80');"></div>
    <div class="bg-slide" style="background-image:url('https://images.unsplash.com/photo-1611087968157-41fa023f8608?auto=format&fit=crop&w=2400&q=80');"></div>
    <div class="bg-slide" style="background-image:url('https://images.pexels.com/photos/3137890/pexels-photo-3137890.jpeg?auto=compress&cs=tinysrgb&w=2400');"></div>
    <div class="bg-dim"></div>
    <div class="bg-vignette"></div>
    <div class="particles" id="particles"></div>
  </div>

  <!-- Header -->
  <header class="topbar fade-in">
    <div class="logo">
      <svg viewBox="0 0 111 30" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="nfg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ff2a34"/>
            <stop offset="55%" stop-color="#e50914"/>
            <stop offset="100%" stop-color="#a3060e"/>
          </linearGradient>
        </defs>
        <path fill="url(#nfg)" d="M105.06 14.28L111 30c-1.75-.25-3.5-.56-5.28-.84L102.37 20.47 98.94 28.44c-1.69-.28-3.34-.38-5.03-.6L99.94 14.09 94.47 0h5.06l3.06 7.87L105.87 0H111l-5.94 14.28zM90.47 0h-4.6v27.25c1.5.09 3.06.16 4.6.34V0zM81.9 26.94c-4.18-.28-8.37-.53-12.65-.62V0h4.68v21.87c2.69.06 5.38.28 7.97.41v4.66zM64.25 10.66v4.68h-6.4V26h-4.63V0h13.12v4.69h-8.49v5.97h6.4zM45.34 4.69V26.25c-1.56 0-3.16 0-4.68.06V4.69h-4.85V0h14.41v4.69h-4.88zM30.75 15.59c-2.06 0-4.5 0-6.25.09v6.97c2.75-.19 5.5-.41 8.28-.5v4.5L19.81 27.69V0h12.97v4.69h-8.28v6.31c1.81 0 4.59-.09 6.25-.09v4.68zM4.78 12.97v16.37c-1.69.19-3.19.41-4.78.66V0h4.47l6.09 17.03V0h4.69v28.06c-1.66.28-3.34.38-5.13.63L4.78 12.97z"/>
      </svg>
    </div>
    <button class="help-btn" onclick="alert('Help center coming soon.')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span>Need help?</span>
    </button>
  </header>

  <!-- Main login card -->
  <main class="main">
    <div class="card-wrap fade-up">
      <div class="glass-card">
        <div class="light-sweep"></div>
        <div class="noise"></div>

        <div class="card-inner">
          <div class="brand">
            <div class="logo big">
              <svg viewBox="0 0 111 30" xmlns="http://www.w3.org/2000/svg">
                <path fill="url(#nfg)" d="M105.06 14.28L111 30c-1.75-.25-3.5-.56-5.28-.84L102.37 20.47 98.94 28.44c-1.69-.28-3.34-.38-5.03-.6L99.94 14.09 94.47 0h5.06l3.06 7.87L105.87 0H111l-5.94 14.28zM90.47 0h-4.6v27.25c1.5.09 3.06.16 4.6.34V0zM81.9 26.94c-4.18-.28-8.37-.53-12.65-.62V0h4.68v21.87c2.69.06 5.38.28 7.97.41v4.66zM64.25 10.66v4.68h-6.4V26h-4.63V0h13.12v4.69h-8.49v5.97h6.4zM45.34 4.69V26.25c-1.56 0-3.16 0-4.68.06V4.69h-4.85V0h14.41v4.69h-4.88zM30.75 15.59c-2.06 0-4.5 0-6.25.09v6.97c2.75-.19 5.5-.41 8.28-.5v4.5L19.81 27.69V0h12.97v4.69h-8.28v6.31c1.81 0 4.59-.09 6.25-.09v4.68zM4.78 12.97v16.37c-1.69.19-3.19.41-4.78.66V0h4.47l6.09 17.03V0h4.69v28.06c-1.66.28-3.34.38-5.13.63L4.78 12.97z"/>
              </svg>
            </div>
            <h1>Sign in</h1>
            <p>Welcome back. Please enter your details.</p>
          </div>

          <form id="loginForm" novalidate>
            <div class="float-field">
              <input type="text" id="email" placeholder=" " autocomplete="username" />
              <label for="email">Email or phone number</label>
              <p class="err" id="emailErr"></p>
            </div>

            <div class="float-field">
              <input type="password" id="password" placeholder=" " autocomplete="current-password" />
              <label for="password">Password</label>
              <button type="button" class="eye" id="togglePw" aria-label="Show password">
                <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
              <p class="err" id="pwErr"></p>
            </div>

            <button type="submit" id="signInBtn" class="btn-netflix">Sign In</button>

            <div class="row-between">
              <label class="check">
                <input type="checkbox" id="remember" checked />
                <span class="box"></span>
                <span>Remember me</span>
              </label>
              <button type="button" class="link-muted">Forgot password?</button>
            </div>
          </form>

          <div class="divider">
            <span class="line"></span>
            <span class="or">OR</span>
            <span class="line"></span>
          </div>

          
          <button class="guest-btn" onclick="continueAsGuest()">
            Continue as Guest
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>

          
          <p class="fineprint">
            This page is protected. By continuing you agree to Netflix's
            <span class="u">Terms of Use</span> and <span class="u">Privacy</span>.
          </p>
        </div>
      </div>

      <p class="footer-note">Reimagined by design · 2026 concept · Not affiliated with Netflix, Inc.</p>
    </div>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast">
    <div class="toast-title" id="toastTitle"></div>
    <div class="toast-desc" id="toastDesc"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
